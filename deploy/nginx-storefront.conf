server {
    listen 80;
    server_name yakwetu.dontire.com _;
    root /usr/share/nginx/html;
    index index.html;

    # Demo Lab / storefront events → n8n directly (no paystack-api dependency)
    location = /api/events {
        proxy_pass http://yakwetu-n8n:5678/webhook/yakwetu-event;
        proxy_http_version 1.1;
        proxy_set_header Host n8n.yakwetu.dontire.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Content-Type $content_type;
        proxy_pass_request_body on;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }

    # Demo Lab → trigger YKW-02 abandon SMS scan immediately
    location = /api/demo/abandon-scan {
        proxy_pass http://yakwetu-n8n:5678/webhook/yakwetu-abandon-scan;
        proxy_http_version 1.1;
        proxy_set_header Host n8n.yakwetu.dontire.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Content-Type $content_type;
        proxy_pass_request_body on;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }

    # Same-origin proxy → n8n production webhooks
    location /webhook/ {
        proxy_pass http://yakwetu-n8n:5678/webhook/;
        proxy_http_version 1.1;
        proxy_set_header Host n8n.yakwetu.dontire.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }

    # Paystack API (initialize / verify / config)
    location /api/ {
        proxy_pass http://yakwetu-paystack-api:3001/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    add_header Cache-Control "no-store";
}
