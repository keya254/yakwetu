server {
    listen 80;
    server_name yakwetu.dontire.com _;
    root /usr/share/nginx/html;
    index index.html;

    # Same-origin proxy → n8n (avoids browser CORS "Failed to fetch")
    location /webhook/ {
        proxy_pass http://yakwetu-n8n:5678/webhook/;
        proxy_http_version 1.1;
        # Use n8n's public host so webhook matching / cookies stay correct
        proxy_set_header Host n8n.yakwetu.dontire.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host n8n.yakwetu.dontire.com;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }

    # Paystack API
    location /api/ {
        proxy_pass http://yakwetu-paystack-api:3001/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    add_header Cache-Control "no-store";
}
