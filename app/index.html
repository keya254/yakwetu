<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yakwetu — Watch Kenyan Stories</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#050508; --panel:#12121a; --line:#242430;
    --gold:#e8b54a; --text:#f4f0e8; --muted:#9b95a6;
    --danger:#ff5c5c;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--bg);color:var(--text);font-family:'DM Sans',system-ui,sans-serif;min-height:100vh;padding-bottom:72px}
  a{color:inherit;text-decoration:none}

  header{
    position:fixed;top:0;left:0;right:0;z-index:40;
    display:flex;align-items:center;gap:18px;flex-wrap:wrap;
    padding:16px 4vw;
    background:linear-gradient(180deg,#050508f2 30%,#05050800);
  }
  .logo{font-family:'Bebas Neue',sans-serif;font-size:34px;letter-spacing:3px;color:var(--gold)}
  nav{display:flex;gap:18px;align-items:center;margin-left:auto}
  nav a{color:var(--muted);font-size:13px;font-weight:500}
  nav a:hover,nav a.on{color:#fff}
  .search-wrap{flex:1;min-width:180px;max-width:360px;position:relative}
  .search-wrap input{
    width:100%;background:#16161fcc;border:1px solid var(--line);color:var(--text);
    border-radius:999px;padding:10px 16px 10px 38px;font-size:14px;
  }
  .search-wrap::before{content:'⌕';position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted)}

  .hero{
    position:relative;min-height:88vh;display:flex;align-items:flex-end;
    padding:0 4vw 64px;overflow:hidden;
  }
  .hero-bg{
    position:absolute;inset:0;
    background:
      linear-gradient(90deg,#050508 8%,transparent 58%),
      linear-gradient(0deg,#050508 5%,transparent 48%),
      radial-gradient(ellipse 70% 55% at 72% 38%, color-mix(in srgb, var(--hero-bg) 65%, transparent), transparent 70%),
      var(--hero-bg);
    transition:background .6s ease;
  }
  .hero-poster{
    position:absolute;right:6%;top:14%;bottom:18%;width:min(320px,38vw);
    border-radius:14px;overflow:hidden;border:1px solid #ffffff18;
    box-shadow:0 40px 100px #000c;background:#111;
  }
  .hero-poster img{width:100%;height:100%;object-fit:cover}
  .hero-poster .fb{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:96px}
  @media(max-width:900px){.hero-poster{display:none}.hero{min-height:70vh}}
  .hero-copy{position:relative;z-index:2;max-width:560px}
  .hero h1{font-family:'Bebas Neue',sans-serif;font-size:clamp(48px,9vw,86px);line-height:.92;letter-spacing:1px;margin-bottom:10px}
  .hero .meta{color:var(--muted);font-size:13px;margin-bottom:12px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .hero .meta .star{color:var(--gold)}
  .hero p{color:#d8d2c6;font-size:15px;line-height:1.55;margin-bottom:20px;max-width:480px}
  .cta{display:flex;gap:10px;flex-wrap:wrap}
  .cta button,.cta a.btn{
    border:none;border-radius:6px;padding:12px 22px;font-weight:700;font-size:14px;cursor:pointer;
    display:inline-flex;align-items:center;gap:8px;
  }
  .cta .primary{background:#fff;color:#111}
  .cta .buy{background:var(--gold);color:#120e08}
  .cta .ghost{background:rgba(255,255,255,.14);color:#fff}

  .profile{
    margin:8px 4vw 0;padding:18px 20px;border-radius:14px;
    background:linear-gradient(135deg,#16161fcc,#0e0e14aa);
    border:1px solid var(--line);
    display:flex;gap:16px;align-items:center;flex-wrap:wrap;
  }
  .avatar{
    width:52px;height:52px;border-radius:50%;background:#2a2438;border:2px solid var(--gold);
    display:flex;align-items:center;justify-content:center;font-weight:700;font-size:18px;
  }
  .profile .who{font-weight:700}
  .profile .sub{color:var(--muted);font-size:13px;margin-top:2px}

  .rows{padding:18px 0 48px}
  .row{margin:26px 0}
  .row-head{display:flex;justify-content:space-between;align-items:baseline;padding:0 4vw 12px}
  .row-head h3{font-size:20px;font-weight:700}
  .row-head span{color:var(--muted);font-size:12px}
  .scroller{
    display:flex;gap:12px;overflow-x:auto;padding:4px 4vw 14px;
    scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;
  }
  .scroller::-webkit-scrollbar{height:5px}
  .scroller::-webkit-scrollbar-thumb{background:#333;border-radius:99px}

  .tile{
    flex:0 0 158px;scroll-snap-align:start;cursor:pointer;
    transition:transform .2s;
  }
  .tile:hover{transform:translateY(-6px) scale(1.04);z-index:2}
  .tile .art{
    height:236px;border-radius:10px;display:flex;align-items:center;justify-content:center;
    font-size:52px;position:relative;overflow:hidden;border:1px solid #ffffff10;
  }
  .tile .art img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .tile .art::after{
    content:'';position:absolute;inset:0;
    background:linear-gradient(180deg,transparent 45%,rgba(0,0,0,.8));
  }
  .tile .art .em{position:relative;z-index:1}
  .tile .info{padding:10px 2px 0}
  .tile h4{font-size:13px;line-height:1.25;margin-bottom:3px}
  .tile .g{color:var(--muted);font-size:11px}
  .tile .price{color:var(--gold);font-size:12px;font-weight:700;margin-top:4px}
  .owned{position:absolute;top:8px;left:8px;z-index:2;background:#000a;color:var(--gold);font-size:10px;padding:3px 7px;border-radius:4px;font-weight:700}

  .providers{display:flex;gap:14px;overflow-x:auto;padding:4px 4vw 10px}
  .prov{
    flex:0 0 72px;text-align:center;cursor:pointer;color:var(--muted);font-size:11px;
  }
  .prov .c{
    width:64px;height:64px;border-radius:50%;margin:0 auto 8px;
    display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:800;
    border:2px solid var(--line);background:#14141c;
  }
  .prov:hover .c{border-color:var(--gold);color:var(--gold)}

  .empty{padding:40px 4vw;color:var(--muted)}
  footer{padding:40px 4vw 24px;border-top:1px solid var(--line);color:var(--muted);font-size:12px;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}
  footer .logo{font-size:24px}
  .cfg{position:fixed;bottom:0;left:0;right:0;background:#0d0d12ee;border-top:1px solid var(--line);padding:8px 16px;display:flex;gap:10px;align-items:center;font-size:12px;color:var(--muted);z-index:40;flex-wrap:wrap}
  .cfg input{background:#16161f;border:1px solid var(--line);color:var(--text);padding:6px 10px;border-radius:6px;width:220px}
  .cfg button{background:#2a2a36;color:var(--text);border:none;padding:6px 12px;border-radius:6px;cursor:pointer}
  #toast{position:fixed;top:70px;right:16px;z-index:50;display:flex;flex-direction:column;gap:8px}
  .t{background:#16161f;border-left:3px solid var(--gold);padding:10px 14px;border-radius:8px;font-size:13px;max-width:300px}
  .t.err{border-left-color:var(--danger)}
</style>
</head>
<body>
<header>
  <a class="logo" href="index.html">YAKWETU</a>
  <div class="search-wrap">
    <input id="q" type="search" placeholder="Search titles, actors, genres…" autocomplete="off">
  </div>
  <nav>
    <a class="on" href="index.html">Home</a>
    <a href="#movies">Movies</a>
    <a href="#because">My List</a>
    <a href="demo-lab.html">Demo Lab</a>
    <a href="#" id="logoutBtn">Log out</a>
  </nav>
</header>

<section class="hero" id="hero">
  <div class="hero-bg" id="heroBg"></div>
  <div class="hero-poster" id="heroPoster"></div>
  <div class="hero-copy">
    <h1 id="heroTitle">—</h1>
    <div class="meta" id="heroMeta"></div>
    <p id="heroBlurb"></p>
    <div class="cta">
      <button class="primary" type="button" id="heroPlay">▶ Play / Buy</button>
      <button class="ghost" type="button" id="heroInfo">ⓘ More info</button>
    </div>
  </div>
</section>

<section class="profile" id="profileBox">
  <div class="avatar" id="avatar">Y</div>
  <div>
    <div class="who" id="profileName">Guest</div>
    <div class="sub" id="profileSub">Sign in to unlock purchases &amp; SMS recommendations</div>
  </div>
</section>

<section class="rows" id="rows"></section>
<p class="empty" id="empty" style="display:none">No titles match your search.</p>

<footer>
  <div>
    <div class="logo">YAKWETU</div>
    <p style="margin-top:8px">Kenyan stories · demo pricing from KES 5 · SMS upsell via n8n</p>
  </div>
  <a href="#hero" style="color:var(--gold)">↑ Back to top</a>
</footer>

<div class="cfg">
  <span>Events →</span>
  <input id="whBase" placeholder="leave blank = /api/events">
  <button type="button" onclick="saveCfg()">Save</button>
  <span id="cfgStatus"></span>
  <span style="margin-left:auto" id="who"></span>
</div>
<div id="toast"></div>

<script src="shared.js"></script>
<script src="catalog.js"></script>
<script src="library.js"></script>
<script>
let featured = CATALOG[0];
let heroTimer = null;

function artHtml(m){
  const owned = typeof isOwned === 'function' && isOwned(m.id);
  const img = m.poster
    ? `<img src="${m.poster}" alt="" loading="lazy" onerror="this.remove()">`
    : '';
  return `<div class="art" style="background:${m.bg}">
    ${owned ? '<span class="owned">OWNED</span>' : ''}
    ${img}<span class="em">${m.emoji}</span>
  </div>`;
}

function tileHtml(m){
  return `<article class="tile" data-id="${m.id}">
    ${artHtml(m)}
    <div class="info">
      <h4>${m.title}</h4>
      <div class="g">${m.genre} · ${m.year || ''}</div>
      <div class="price">KES ${m.price}</div>
    </div>
  </article>`;
}

function setHero(m){
  featured = m;
  document.getElementById('hero').style.setProperty('--hero-bg', m.bg);
  document.getElementById('heroTitle').textContent = m.title;
  document.getElementById('heroMeta').innerHTML =
    `<span class="star">★ ${m.rating || '—'}</span><span>${m.year || ''}</span><span>${m.genre}</span><span>KES ${m.price}</span>`;
  document.getElementById('heroBlurb').textContent = m.blurb || '';
  const hp = document.getElementById('heroPoster');
  if (m.poster) {
    hp.innerHTML = `<img src="${m.poster}" alt="" onerror="this.parentNode.innerHTML='<div class=fb style=background:${m.bg}>${m.emoji}</div>'">`;
  } else {
    hp.innerHTML = `<div class="fb" style="background:${m.bg}">${m.emoji}</div>`;
  }
  const play = document.getElementById('heroPlay');
  if (typeof isOwned === 'function' && isOwned(m.id)) {
    play.textContent = '▶ Play';
    play.className = 'primary';
  } else {
    play.textContent = `Buy · KES ${m.price}`;
    play.className = 'buy';
  }
}

function openMovie(m){
  track('browse', m);
  location.href = 'movie.html?m=' + encodeURIComponent(m.id);
}

function playOrBuy(m){
  track('browse', m);
  if (typeof isOwned === 'function' && isOwned(m.id)) {
    location.href = 'watch.html?m=' + encodeURIComponent(m.id);
    return;
  }
  track('checkout_start', m);
  const q = new URLSearchParams({ m: m.id, title: m.title, genre: m.genre, price: m.price });
  location.href = 'checkout.html?' + q.toString();
}

document.getElementById('heroPlay').onclick = () => playOrBuy(featured);
document.getElementById('heroInfo').onclick = () => openMovie(featured);

function rowSection(title, items, id){
  if (!items.length) return '';
  return `<section class="row" ${id ? `id="${id}"` : ''}>
    <div class="row-head"><h3>${title}</h3><span>${items.length} titles</span></div>
    <div class="scroller">${items.map(tileHtml).join('')}</div>
  </section>`;
}

function bindTiles(root){
  root.querySelectorAll('.tile').forEach((el) => {
    const m = getMovieById(el.dataset.id);
    el.onclick = () => openMovie(m);
  });
}

function render(list){
  const rows = document.getElementById('rows');
  const empty = document.getElementById('empty');
  if (!list.length) {
    rows.innerHTML = '';
    empty.style.display = 'block';
    return;
  }
  empty.style.display = 'none';

  const parts = [];

  // Profile recommendations (Netflix-style)
  const rec = profileRecommendations(14);
  parts.push(rowSection(rec.headline, rec.items, 'because'));

  const owned = ownedMovies();
  if (owned.length) parts.push(rowSection('My List', owned, 'mylist'));

  parts.push(`<section class="row">
    <div class="row-head"><h3>Browse by vibe</h3><span>quick filters</span></div>
    <div class="providers" id="providers"></div>
  </section>`);

  const trending = list.slice().sort((a,b) => Number(b.rating||0) - Number(a.rating||0)).slice(0,16);
  parts.push(rowSection('Trending on Yakwetu', trending, 'movies'));

  const cheap = list.filter((m) => m.price <= 10).slice(0,16);
  parts.push(rowSection('From KES 5 — demo deals', cheap));

  const awardish = list.filter((m) => Number(m.rating||0) >= 7).slice(0,16);
  parts.push(rowSection('Critically loved', awardish));

  const genreOrder = [
    'Crime Drama','Crime Thriller','Action Thriller','Thriller','Psych Thriller',
    'Drama','Romance Drama','Romance','Comedy','Horror','Sci-Fi','Wildlife Doc',
    'Music Drama','Family Drama','Coastal Thriller'
  ];
  genreOrder.forEach((g) => {
    const items = list.filter((m) => m.genre === g);
    if (items.length) parts.push(rowSection(g, items));
  });
  genresInCatalog().forEach((g) => {
    if (genreOrder.includes(g)) return;
    const items = list.filter((m) => m.genre === g);
    if (items.length) parts.push(rowSection(g, items));
  });

  rows.innerHTML = parts.join('');
  bindTiles(rows);

  const vibes = [
    { label:'Crime', q:'crime', c:'🕵️' },
    { label:'Romance', q:'romance', c:'💛' },
    { label:'Comedy', q:'comedy', c:'😂' },
    { label:'Horror', q:'horror', c:'👻' },
    { label:'Docs', q:'doc', c:'🦏' },
    { label:'Thriller', q:'thriller', c:'🔪' },
    { label:'Classic', q:'19', c:'🎞️' },
    { label:'All', q:'', c:'📺' },
  ];
  const prov = document.getElementById('providers');
  if (prov) {
    prov.innerHTML = vibes.map((v) =>
      `<div class="prov" data-q="${v.q}"><div class="c">${v.c}</div>${v.label}</div>`
    ).join('');
    prov.querySelectorAll('.prov').forEach((el) => {
      el.onclick = () => {
        document.getElementById('q').value = el.dataset.q;
        applySearch();
      };
    });
  }
}

function applySearch(){
  const q = document.getElementById('q').value;
  const list = searchMovies(q);
  render(list);
  if (list[0]) setHero(list[0]);
}

document.getElementById('q').addEventListener('input', () => {
  clearTimeout(window.__qT);
  window.__qT = setTimeout(applySearch, 120);
});

function startHeroRotate(){
  clearInterval(heroTimer);
  heroTimer = setInterval(() => {
    if (document.getElementById('q').value.trim()) return;
    setHero(CATALOG[Math.floor(Math.random() * CATALOG.length)]);
  }, 10000);
}

function paintProfile(){
  if (!USER) return;
  document.getElementById('profileName').textContent = USER.name;
  document.getElementById('avatar').textContent = (USER.name || 'Y').charAt(0).toUpperCase();
  const watched = loadWatched();
  const owned = Object.keys(loadLibrary()).length;
  document.getElementById('profileSub').textContent =
    `${USER.phone} · ${owned} unlocked · ${watched.length} finished · SMS recs on finish`;
  document.getElementById('who').textContent = USER.name + ' · ' + USER.phone;
}

async function enrichPosters(){
  try {
    const cached = JSON.parse(localStorage.getItem('ykw_posters') || '{}');
    let applied = 0;
    for (const m of CATALOG) {
      if (!m.poster && cached[m.id]) {
        m.poster = cached[m.id];
        applied++;
      }
    }
    const r = await fetch('/api/catalog/enrich', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        titles: CATALOG.filter((m) => !m.poster).slice(0, 25).map((m) => ({
          id: m.id, title: m.title, year: m.year, tmdb: m.tmdb || 0, imdb: m.imdb || ''
        })),
      }),
    });
    if (!r.ok) return applied;
    const data = await r.json();
    const map = data.posters || {};
    Object.assign(cached, map);
    localStorage.setItem('ykw_posters', JSON.stringify(cached));
    for (const m of CATALOG) {
      if (map[m.id]) m.poster = map[m.id];
    }
    return Object.keys(map).length + applied;
  } catch {
    return 0;
  }
}

setHero(CATALOG.find((m) => m.id === 'nairobi-half-life') || CATALOG[0]);
paintProfile();
render(CATALOG);
startHeroRotate();
enrichPosters().then((n) => {
  if (n > 0) {
    render(searchMovies(document.getElementById('q').value));
    setHero(featured);
  }
});
</script>
</body>
</html>
