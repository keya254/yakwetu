<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yakwetu — African Stories, Streamed</title>
<style>
  :root{--bg:#0e0e14;--panel:#17171f;--gold:#e8b54a;--text:#f5f0e6;--muted:#9a94a8;--green:#3ddc84;--red:#ff5c5c}
  *{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',system-ui,sans-serif}
  body{background:var(--bg);color:var(--text);min-height:100vh}
  header{display:flex;align-items:center;justify-content:space-between;padding:20px 40px;border-bottom:1px solid #23232e}
  .logo{font-size:26px;font-weight:800;letter-spacing:4px;color:var(--gold)}
  .logo span{color:var(--text);font-weight:300}
  nav a{color:var(--muted);text-decoration:none;margin-left:24px;font-size:14px}
  nav a:hover{color:var(--gold)}
  .hero{padding:56px 40px 24px}
  .hero h1{font-size:38px;max-width:640px;line-height:1.2}
  .hero h1 em{color:var(--gold);font-style:normal}
  .hero p{color:var(--muted);margin-top:12px;max-width:520px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:22px;padding:32px 40px 80px}
  .card{background:var(--panel);border-radius:14px;overflow:hidden;border:1px solid #23232e;transition:transform .2s,border-color .2s;cursor:pointer}
  .card:hover{transform:translateY(-4px);border-color:var(--gold)}
  .poster{height:150px;display:flex;align-items:center;justify-content:center;font-size:44px}
  .meta{padding:16px}
  .meta h3{font-size:16px;margin-bottom:4px}
  .meta .genre{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:1px}
  .meta .row{display:flex;justify-content:space-between;align-items:center;margin-top:12px}
  .price{color:var(--gold);font-weight:700}
  .buy{background:var(--gold);color:#0e0e14;border:none;padding:8px 16px;border-radius:8px;font-weight:700;cursor:pointer;font-size:13px}
  .buy:hover{filter:brightness(1.1)}
  /* settings bar */
  .cfg{position:fixed;bottom:0;left:0;right:0;background:#101018;border-top:1px solid #23232e;padding:10px 20px;display:flex;gap:10px;align-items:center;font-size:12px;color:var(--muted);z-index:10}
  .cfg input{background:#1c1c26;border:1px solid #2c2c3a;color:var(--text);padding:6px 10px;border-radius:6px;font-size:12px;width:320px}
  .cfg button{background:#2c2c3a;color:var(--text);border:none;padding:6px 12px;border-radius:6px;cursor:pointer;font-size:12px}
  .cfg .ok{color:var(--green)} .cfg .err{color:var(--red)}
  #toast{position:fixed;top:20px;right:20px;display:flex;flex-direction:column;gap:8px;z-index:20}
  .t{background:#1c1c26;border-left:3px solid var(--gold);padding:10px 16px;border-radius:8px;font-size:13px;max-width:320px;animation:slide .3s}
  .t.err{border-left-color:var(--red)}
  @keyframes slide{from{transform:translateX(40px);opacity:0}to{transform:none;opacity:1}}
</style>
</head>
<body>
<header>
  <div class="logo">YAKWETU<span>·stream</span></div>
  <nav><a href="index.html">Browse</a><a href="checkout.html">Checkout</a><a href="watch.html">Watch</a></nav>
</header>

<div class="hero">
  <h1>African stories, <em>owned by you.</em> No subscription — buy what you love.</h1>
  <p>Direct purchases from Kenya's boldest filmmakers. Pay with M-Pesa, watch instantly.</p>
</div>

<div class="grid" id="grid"></div>

<div class="cfg">
  <span>⚙️ n8n webhook base:</span>
  <input id="whBase" placeholder="https://your-n8n.example.com  (leave blank = offline demo)">
  <button onclick="saveCfg()">Save</button>
  <span id="cfgStatus"></span>
  <span style="margin-left:auto">viewer: <b id="who"></b></span>
</div>
<div id="toast"></div>

<script src="shared.js"></script>
<script>
const MOVIES = [
  {id:'nairobi-nights', title:'Nairobi Nights', genre:'Crime Drama', price:150, emoji:'🌃', bg:'#2b1e3f'},
  {id:'sauti-ya-mtaa', title:'Sauti ya Mtaa', genre:'Music Drama', price:120, emoji:'🎤', bg:'#3f1e2e'},
  {id:'katana', title:'Katana', genre:'Coastal Thriller', price:140, emoji:'🗡️', bg:'#1e3f38'},
  {id:'matatu-diaries', title:'The Matatu Diaries', genre:'Comedy', price:100, emoji:'🚌', bg:'#3f341e'},
  {id:'kifaru', title:'Kifaru', genre:'Wildlife Doc', price:130, emoji:'🦏', bg:'#263f1e'},
  {id:'dhahabu', title:'Dhahabu', genre:'Romance', price:110, emoji:'💛', bg:'#3f2a1e'},
  {id:'wazi', title:'Wazi', genre:'Psych Thriller', price:140, emoji:'🌀', bg:'#1e2a3f'},
  {id:'baraka', title:'Baraka ya Bibi', genre:'Family Drama', price:115, emoji:'🏠', bg:'#331e3f'},
];

const grid = document.getElementById('grid');
MOVIES.forEach(m => {
  const el = document.createElement('div');
  el.className = 'card';
  el.innerHTML = `
    <div class="poster" style="background:${m.bg}">${m.emoji}</div>
    <div class="meta">
      <h3>${m.title}</h3>
      <div class="genre">${m.genre}</div>
      <div class="row"><span class="price">KES ${m.price}</span><button class="buy">Buy</button></div>
    </div>`;
  el.querySelector('.poster').onclick = () => viewMovie(m);
  el.querySelector('.meta h3').onclick = () => viewMovie(m);
  el.querySelector('.buy').onclick = (e) => { e.stopPropagation(); buyMovie(m); };
  grid.appendChild(el);
});

function viewMovie(m){
  track('browse', m);
  toast(`👁 Browsing “${m.title}” — event sent`);
}
function buyMovie(m){
  track('browse', m);
  track('checkout_start', m);
  const q = new URLSearchParams({m:m.id, title:m.title, genre:m.genre, price:m.price});
  location.href = 'checkout.html?' + q.toString();
}
document.getElementById('who').textContent = USER.name;
</script>
</body>
</html>
